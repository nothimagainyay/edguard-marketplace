<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDguard Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        
        /* NAVBAR */
        nav {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
            padding: 0 2rem;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            height: 65px;
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .nav-brand .logo-icon {
            background: #f59e0b; border-radius: 8px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }
        .nav-brand span {
            color: white; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px;
        }
        .nav-brand span em { color: #f59e0b; font-style: normal; }
        .nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .nav-links a {
            color: rgba(255,255,255,0.85); text-decoration: none;
            padding: 0.5rem 1rem; border-radius: 6px;
            font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.15); color: white; }
        .nav-links .btn-nav {
            background: #f59e0b; color: #1e3a5f;
            font-weight: 600; padding: 0.5rem 1.2rem;
        }
        .nav-links .btn-nav:hover { background: #fbbf24; color: #1e3a5f; }
        .nav-user {
            color: rgba(255,255,255,0.7); font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
            color: white; text-align: center;
            padding: 4rem 2rem 3rem;
        }
        .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
        .hero h1 span { color: #f59e0b; }
        .hero p { font-size: 1.1rem; opacity: 0.85; max-width: 600px; margin: 0 auto 2rem; }
        .hero-badges { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .badge {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.4rem 1rem; border-radius: 20px;
            font-size: 0.85rem; font-weight: 500;
        }

        /* CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: #1e3a5f; color: white;
            padding: 0.6rem 1.4rem; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 0.9rem;
            border: none; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 2px 8px rgba(30,58,95,0.3);
        }
        .btn:hover { background: #2d6a9f; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,95,0.4); }
        .btn-gold { background: #f59e0b; color: #1e3a5f; box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
        .btn-gold:hover { background: #fbbf24; box-shadow: 0 4px 12px rgba(245,158,11,0.4); }
        .btn-outline {
            background: transparent; color: #1e3a5f;
            border: 2px solid #1e3a5f;
            box-shadow: none;
        }
        .btn-outline:hover { background: #1e3a5f; color: white; }

        /* LISTING CARDS */
        .listings-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .listings-header h2 { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
        .listings-count { color: #64748b; font-size: 0.9rem; }
        .listings-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .listing-card {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden; transition: all 0.3s;
            border: 1px solid #e2e8f0;
        }
        .listing-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .card-image {
            height: 200px; background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-image .no-image { color: #94a3b8; font-size: 3rem; }
        .card-body { padding: 1.2rem; }
        .card-title {
            font-size: 1.05rem; font-weight: 700; color: #1e293b;
            margin-bottom: 0.5rem; text-decoration: none;
            display: block;
        }
        .card-title:hover { color: #2d6a9f; }
        .card-meta {
            display: flex; gap: 1rem; margin-bottom: 0.8rem;
            font-size: 0.85rem; color: #64748b;
        }
        .card-meta span { display: flex; align-items: center; gap: 0.3rem; }
        .card-description { color: #475569; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .price-tag { font-size: 1.2rem; font-weight: 700; color: #1e3a5f; }
        .status-badge {
            padding: 0.3rem 0.8rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef9c3; color: #854d0e; }
        .status-flagged { background: #fee2e2; color: #991b1b; }

        /* DETAIL PAGE */
        .detail-grid { display: grid; grid-template-columns: 1fr 380px; gap: 2rem; }
        .detail-image {
            border-radius: 12px; overflow: hidden;
            height: 400px; background: #e2e8f0;
        }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-card {
            background: white; border-radius: 12px; padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .detail-price { font-size: 2rem; font-weight: 700; color: #1e3a5f; margin-bottom: 1rem; }
        .detail-row {
            display: flex; justify-content: space-between;
            padding: 0.7rem 0; border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: #64748b; font-weight: 500; }
        .detail-row .value { font-weight: 600; color: #1e293b; }
        .fraud-score-bar {
            margin: 1rem 0; padding: 1rem;
            background: #f8fafc; border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .fraud-score-bar .score-label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; margin-bottom: 0.5rem;
        }
        .score-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .score-low { background: #22c55e; }
        .score-mid { background: #f59e0b; }
        .score-high { background: #ef4444; }

        /* FORM PAGE */
        .form-card {
            background: white; border-radius: 12px; padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0; max-width: 700px; margin: 0 auto;
        }
        .form-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .form-card p { color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .form-card input, .form-card textarea, .form-card select {
            width: 100%; padding: 0.7rem 1rem;
            border: 1px solid #e2e8f0; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            transition: border 0.2s; background: #f8fafc;
        }
        .form-card input:focus, .form-card textarea:focus {
            outline: none; border-color: #2d6a9f;
            background: white; box-shadow: 0 0 0 3px rgba(45,106,159,0.1);
        }
        .form-card label { font-weight: 600; font-size: 0.85rem; color: #374151; display: block; margin-bottom: 0.3rem; }
        .form-card p { margin-bottom: 1rem; }

        /* AUTH PAGES */
        .auth-wrapper {
            min-height: 80vh; display: flex;
            align-items: center; justify-content: center; padding: 2rem;
        }
        .auth-card {
            background: white; border-radius: 16px; padding: 2.5rem;
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0; width: 100%; max-width: 420px;
        }
        .auth-card .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-card h2 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.3rem; }
        .auth-card .auth-sub { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .auth-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        .auth-link a { color: #2d6a9f; font-weight: 600; text-decoration: none; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center; padding: 4rem 2rem;
            background: white; border-radius: 12px;
            border: 2px dashed #e2e8f0;
        }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .empty-state p { color: #64748b; margin-bottom: 1.5rem; }

        /* FOOTER */
        footer {
            background: #1e3a5f; color: rgba(255,255,255,0.7);
            text-align: center; padding: 1.5rem;
            margin-top: 4rem; font-size: 0.85rem;
        }
        footer span { color: #f59e0b; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/listings/" class="nav-brand">
                <div class="logo-icon">🛡️</div>
                <span>ED<em>guard</em></span>
            </a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <span class="nav-user">👤 {{ user.username }}</span>
                    <a href="/listings/create/" class="btn-nav" style="background:#f59e0b; color:#1e3a5f; padding:0.5rem 1.2rem; border-radius:6px; font-weight:600; text-decoration:none;">+ Post Listing</a>
                    <a href="/accounts/logout/">Logout</a>
                {% else %}
                    <a href="/accounts/login/">Login</a>
                    <a href="/accounts/register/" class="btn-nav" style="background:#f59e0b; color:#1e3a5f; padding:0.5rem 1.2rem; border-radius:6px; font-weight:600; text-decoration:none;">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div>
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>© 2026 <span>EDguard</span> Marketplace — AI-Powered Fraud Detection System | FYP Project</p>
    </footer>
</body>
</html>
